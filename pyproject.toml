[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deviation-tracker"
version = "0.1.0"
description = "Application macOS de remontee des deviations d'equipe avec resume par e-mail"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = [
    "pyobjc-framework-Cocoa",
]
test = [
    "pytest",
]

[project.scripts]
deviation-tracker = "deviation_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["deviation_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
